<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <title>Three.js street shader</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
    }

    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 14px;
      border-radius: 6px;
      pointer-events: none;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
  <!-- From: https://threejs.org/manual/#installation -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="info">
    <strong>Procedural roads</strong><br />
    Left mouse button: Rotate | Right mouse button: Move | Mouse wheel: Zoom
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 1000);
    camera.position.set(0, 45, 55);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.update();

    // Map size: 100m x 100m (-50 to +50)
    const MAP_SIZE = 100.0;
    const TEX_RES = 2048;
    const LENGTH_SCALE = 100.0;
    const ROAD_HALF_WIDTH = 3.5;
    const SIDEWALK_WIDTH = 2.0;
    const CURB_WIDTH = 0.15;

    const dataRenderTarget = new THREE.WebGLRenderTarget(TEX_RES, TEX_RES, {
      type: THREE.FloatType,
      format: THREE.RGBAFormat,
      minFilter: THREE.NearestFilter,
      magFilter: THREE.NearestFilter,
      depthBuffer: true
    });

    const dataScene = new THREE.Scene();

    const roadMaterial = new THREE.ShaderMaterial({
      uniforms: {
        totalHalfWidth: { value: ROAD_HALF_WIDTH + SIDEWALK_WIDTH },
        lengthScale: { value: LENGTH_SCALE }
      },
      vertexShader: `
        attribute vec2 aLocalUV;
        attribute float aStartDist;
        attribute float aSegLen;

        varying vec2 vLocalUV;
        varying float vStartDist;
        varying float vSegLen;

        void main() {
          vLocalUV = aLocalUV;
          vStartDist = aStartDist;
          vSegLen = aSegLen;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float totalHalfWidth;
        uniform float lengthScale;
        varying vec2 vLocalUV;
        varying float vStartDist;
        varying float vSegLen;

        void main() {
          float alongSeg = vLocalUV.x;
          float lateral = vLocalUV.y;
          float totalAlong = vStartDist + alongSeg;

          float distToStart = -alongSeg;
          float distToEnd = -(vSegLen - alongSeg);
          float signedLongDistOuter = max(0.0, max(distToStart, distToEnd));

          float roundedDist = length(vec2(lateral, signedLongDistOuter));
          gl_FragDepth = 0.5*(gl_FragCoord.z + roundedDist / totalHalfWidth);

          gl_FragColor = vec4(
            (totalAlong + totalHalfWidth) / lengthScale,
            (lateral + totalHalfWidth) / (2.0 * totalHalfWidth),
            (alongSeg + totalHalfWidth) / (2.0 * totalHalfWidth),
            vSegLen / lengthScale);
        }
      `,
      side: THREE.DoubleSide
    });

    function createRoadDataMesh(points, totalHalfWidth = ROAD_HALF_WIDTH + SIDEWALK_WIDTH) {
      const positions = [];
      const localUVs = [];
      const startDists = [];
      const segLens = [];
      const indices = [];

      let accumulatedLength = 0.0;
      let vertOffset = 0;

      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i];
        const p1 = points[i + 1];
        const dir = new THREE.Vector2().subVectors(p1, p0);
        const segLen = dir.length();
        dir.normalize();

        const right = new THREE.Vector2(-dir.y, dir.x);

        const extStart = -totalHalfWidth;
        const extEnd = segLen + totalHalfWidth;

        const corners = [
          { along: extStart, lat: -totalHalfWidth },
          { along: extEnd, lat: -totalHalfWidth },
          { along: extEnd, lat: totalHalfWidth },
          { along: extStart, lat: totalHalfWidth }
        ];

        for (const c of corners) {
          const wx = p0.x + dir.x * c.along + right.x * c.lat;
          const wz = p0.y + dir.y * c.along + right.y * c.lat;

          positions.push(wx, 0, wz);
          localUVs.push(c.along, c.lat);
          startDists.push(accumulatedLength);
          segLens.push(segLen);
        }

        indices.push(
          vertOffset + 0, vertOffset + 1, vertOffset + 2,
          vertOffset + 0, vertOffset + 2, vertOffset + 3
        );

        accumulatedLength += segLen;
        vertOffset += 4;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('aLocalUV', new THREE.Float32BufferAttribute(localUVs, 2));
      geo.setAttribute('aStartDist', new THREE.Float32BufferAttribute(startDists, 1));
      geo.setAttribute('aSegLen', new THREE.Float32BufferAttribute(segLens, 1));
      geo.setIndex(indices);

      return new THREE.Mesh(geo, roadMaterial);
    }

    const mainRoad = [
      new THREE.Vector2(-40, -10),
      new THREE.Vector2(0, -10),
      new THREE.Vector2(40, 5)
    ];
    const sideRoad = [
      new THREE.Vector2(0, -10),
      new THREE.Vector2(-5, 20),
      new THREE.Vector2(15, 32)
    ];

    dataScene.add(createRoadDataMesh(mainRoad));
    dataScene.add(createRoadDataMesh(sideRoad));

    const groundMaterial = new THREE.ShaderMaterial({
      uniforms: {
        u_resolution: { value: new THREE.Vector2() },
        uRoadDataTex: { value: dataRenderTarget.texture },
        lengthScale: { value: LENGTH_SCALE },
        roadHalfWidth: { value: ROAD_HALF_WIDTH },
        sidewalkWidth: { value: SIDEWALK_WIDTH },
        curbWidth: { value: CURB_WIDTH },
      },
      vertexShader: `
        varying vec2 vWorldPosXZ;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPosXZ = worldPos.xz;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        varying vec2 vWorldPosXZ;
        uniform vec2 u_resolution;
        uniform sampler2D uRoadDataTex;
        uniform float lengthScale;
        uniform float roadHalfWidth;
        uniform float sidewalkWidth;
        uniform float curbWidth;

        float aaStep(float edge, float x) {
          float width = clamp(fwidth(x), 0.01, 0.3);
          return smoothstep(edge - width, edge + width, x);
        }

        void main() {
          vec4 roadData = texture2D(uRoadDataTex, gl_FragCoord.xy / u_resolution).rgba;

          float totalHalfWidth = roadHalfWidth + sidewalkWidth;
          float alongDist = roadData.r * lengthScale - totalHalfWidth;
          float lateralDist = roadData.g * 2.0 * totalHalfWidth - totalHalfWidth;
          float alongSeg = roadData.b * 2.0 * totalHalfWidth - totalHalfWidth;
          float segLen = roadData.a * lengthScale;
          float absLateral = abs(lateralDist);
          float distToStart = -alongSeg;
          float distToEnd = -(segLen - alongSeg);
          float signedLongDist = max(distToStart, distToEnd);
          float signedLongDistG0 = max(0.0, signedLongDist);

          float roundedEdgeDist = length(vec2(absLateral, signedLongDistG0));

          vec3 asphaltColor  = vec3(0.17, 0.18, 0.20);
          vec3 curbColor     = vec3(0.60, 0.60, 0.63);
          vec3 sidewalkColor = vec3(0.46, 0.45, 0.43);

          float isSidewalk = aaStep(roadHalfWidth + curbWidth, roundedEdgeDist);
          float isCurb     = aaStep(roadHalfWidth, roundedEdgeDist) - isSidewalk;
          float isRoad     = 1.0 - aaStep(roadHalfWidth, roundedEdgeDist);
          float isGrass    = aaStep(totalHalfWidth, roundedEdgeDist);

          float grassNoise = fract(sin(dot(floor(vWorldPosXZ * 2.0), vec2(12.9898, 78.233))) * 43758.5453);
          vec3 grass = mix(vec3(0.20, 0.34, 0.16), vec3(0.24, 0.39, 0.19), grassNoise);
          vec3 finalColor = mix(asphaltColor * isRoad + curbColor * isCurb + sidewalkColor * isSidewalk, grass, isGrass);
          float distToJoints = aaStep(1.5, length(vec2(absLateral, min(abs(distToStart), abs(distToEnd)))));
          finalColor.r += sin(alongSeg) * distToJoints * (1.0 - aaStep(1.0, absLateral)) * (1.0 - aaStep(-1.2, signedLongDist));
          gl_FragColor = vec4(finalColor, 1.0);
        }`
    });
    const groundGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
    groundGeo.rotateX(-Math.PI / 2);
    const groundMesh = new THREE.Mesh(groundGeo, groundMaterial);
    scene.add(groundMesh);

    const buildingMat = new THREE.MeshStandardMaterial({ color: 0xd8d2c5, roughness: 0.8 });
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(30, 60, 20);
    scene.add(dirLight, new THREE.AmbientLight(0xffffff, 0.6));
    const buildings = [
      { x: -18, z: 6, w: 12, h: 14, d: 10 },
      { x: 18, z: 14, w: 14, h: 18, d: 12 },
      { x: -15, z: -26, w: 20, h: 10, d: 12 }
    ];
    for (const b of buildings) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, b.d), buildingMat);
      mesh.position.set(b.x, b.h / 2, b.z);
      scene.add(mesh);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    function animate() {
      requestAnimationFrame(animate);

      if (true) {
        renderer.setRenderTarget(dataRenderTarget);
        renderer.setClearColor(new THREE.Color(0, 999.0, 999.0), 1.0);
        renderer.clear();
        renderer.getDrawingBufferSize(groundMaterial.uniforms.u_resolution.value);
        renderer.render(dataScene, camera);
        renderer.setRenderTarget(null);

        renderer.render(scene, camera);
      } else {
        renderer.render(dataScene, camera);
      }
    }
    animate();
  </script>
</body>

</html>
